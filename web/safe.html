<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="light">
  <meta name="description" content="safeRSI · 从重建场景出发的威胁场景编辑工作台">
  <title>safeRSI · Scene Editing Studio</title>
  <link rel="stylesheet" href="/static/style.css">
  <script src="/static/app.js" defer></script>
</head>
<body data-workspace="threat">
  <aside id="sidebar">
    <a class="brand" href="/safe" aria-label="safeRSI 首页"><span class="brand-mark" aria-hidden="true">◈</span><span><strong>safeRSI</strong><small>SCENE EDITING STUDIO</small></span></a>
    <button id="new-task" class="new-task-button"><span>＋</span> 新建场景编辑任务 <span class="push">↗</span></button>
    <nav aria-label="工作区导航">
      <button class="nav-item active" data-mode="tasks"><span class="nav-symbol">◫</span>威胁场景工作台<span id="task-count" class="nav-count">0</span></button>
      <button class="nav-item" data-mode="versions"><span class="nav-symbol">⑂</span>共享 RSI 版本<span id="version-count" class="nav-count">0</span></button>
      <a class="nav-item workspace-link" href="/rollouts"><span class="nav-symbol">▷</span>Rollout 历史<span class="push">↗</span></a>
      <a class="nav-item workspace-link" href="/"><span class="nav-symbol">◫</span>WorldRSI 场景重建<span class="push">↗</span></a>
    </nav>
    <div class="list-heading"><span id="list-label">最近任务</span><button id="refresh" class="icon-button" title="刷新记录" aria-label="刷新记录">↻</button></div>
    <label class="sr-only" for="search">搜索记录</label><input id="search" class="search" placeholder="搜索任务…" autocomplete="off">
    <div id="records" class="records"></div>
    <footer><button id="settings" class="nav-item"><span class="nav-symbol">⚙</span>模型与运行设置<span id="health-dot" class="dot"></span></button><div class="sidebar-system"><span id="connection-dot" class="dot"></span><span id="connection">正在连接后端</span></div><div class="sidebar-version">⑂ <span id="active-version">等待版本信息</span></div><small>Evidence. Worlds. Evolution.</small></footer>
  </aside>
  <div id="studio-main">
    <header class="topbar"><button id="menu" class="icon-button mobile-only" aria-label="切换导航">☰</button><div id="breadcrumb">研究空间 <span>›</span> 威胁场景工作台</div><div class="topbar-right"><span id="credential" class="service-pill">模型服务</span><span class="engine-pill">NEWTON / WARP</span></div></header>
    <div id="notice" role="status" hidden></div>
    <main id="workspace"><section id="content"></section><aside id="inspector" hidden aria-label="审阅详情"></aside></main>
    <footer class="main-footer"><span>从重建存档出发，按语言编辑世界</span><span>仿真预览 · 编辑证据 · 共享技能</span><span>safeRSI Scene Editing Studio</span></footer>
  </div>
  <dialog id="settings-dialog"><form id="settings-form"><div class="dialog-heading"><div><span class="eyebrow">EXECUTION SETTINGS</span><h2 id="settings-title">模型与运行设置</h2></div><button type="button" data-close="settings-dialog" class="icon-button" aria-label="关闭设置">×</button></div><p id="settings-note" class="muted"></p><div id="settings-fields"></div><details id="advanced-settings" class="advanced"><summary>高级配置 JSON</summary><p class="muted small">可在这里配置未列出的参数；应用到表单后再保存。私密 API key 始终由服务端管理。</p><textarea id="config-json" class="code-input" rows="14" spellcheck="false"></textarea><button id="apply-json" type="button" class="secondary small">应用 JSON 到表单</button></details><details class="advanced"><summary>运行环境</summary><div id="health-info"></div></details><p id="config-error" class="error" hidden></p><div class="dialog-actions"><button type="button" data-close="settings-dialog" class="secondary">取消</button><button id="save-config" type="submit" class="primary">保存设置</button></div></form></dialog>
</body>
</html>
