[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "worldrsiv3"
version = "0.3.0"
requires-python = ">=3.12"
dynamic = ["dependencies"]

[tool.setuptools.dynamic]
dependencies = {file = ["requirements-controller.lock"]}

[tool.setuptools.packages.find]
include = ["harness*", "evaluation*", "orchestration*", "web*"]

[tool.setuptools.package-data]
harness = ["prompts/*.md", "prompts/*.txt", "tools/*.json", "core/LICENSE.stirrup"]
